name: Build

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  pull_request:
  workflow_dispatch:
    inputs:
      screenshot_branch:
        description: 'Bildschirmfoto zusätzlich in den Zweig ci-screenshot schreiben'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  msvc:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurieren
        run: |
          cmake -S . -B build -A x64 2>&1 | Tee-Object -FilePath configure-log.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Bauen
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build-log.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: FTP- und WebDAV-Testserver vorbereiten
        run: |
          python -m pip install --quiet pyftpdlib wsgidav cheroot
          New-Item -ItemType Directory -Force -Path C:\QFilesFtp, C:\QFilesDav, C:\QFilesDavDigest | Out-Null

      - name: Tests ausführen
        env:
          QFILES_TEST_FTP: ftp://test@127.0.0.1:2121/
          QFILES_TEST_FTP_PASS: geheim
          QFILES_TEST_SFTP_RO: sftp://demo@test.rebex.net/
          QFILES_TEST_SFTP_RO_PASS: password
          QFILES_TEST_FTP_RO: ftp://demo@test.rebex.net/
          QFILES_TEST_FTP_RO_PASS: password
          QFILES_TEST_DAV: dav://test@127.0.0.1:8090/
          QFILES_TEST_DAV_PASS: geheim
          QFILES_TEST_DAV_DIGEST: dav://test@127.0.0.1:8091/
          QFILES_TEST_DAV_DIGEST_PASS: geheim
        run: |
          $ftpd = Start-Process python -ArgumentList 'tools\ci-ftpd.py','C:\QFilesFtp','2121' -PassThru -WindowStyle Hidden
          $davd = Start-Process python -ArgumentList 'tools\ci-davd.py','C:\QFilesDav','8090' -PassThru -WindowStyle Hidden
          $davd2 = Start-Process python -ArgumentList 'tools\ci-davd.py','C:\QFilesDavDigest','8091','digest' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          & build\Release\QFilesTests.exe 2>&1 | Tee-Object -FilePath test-log.txt
          $code = $LASTEXITCODE
          foreach ($p in @($ftpd, $davd, $davd2)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          $srv = Get-Content test-log.txt | Select-String -Pattern 'Server-Test|Hostschl|WARNUNG|Verbindung fehl|heruntergeladen|Startverzeichnis' | ForEach-Object { $_.Line.Trim() }
          if ($srv) { Write-Output ("::notice title=FTP/SFTP/WebDAV-Tests::" + ($srv -join ' | ')) }
          if ($code -ne 0) { exit 1 }

      - name: GUI-Test mit Bildschirmfotos
        run: |
          & .\tools\ci-guitest.ps1 -Exe build\Release\QFiles.exe

      - name: Absturzbericht sichern
        if: always()
        run: |
          if (Test-Path C:\ProgramData\QFiles\QFiles-Absturz.txt) { Copy-Item C:\ProgramData\QFiles\QFiles-Absturz.* . }

      - name: Fehlerdiagnose
        if: failure()
        run: |
          foreach ($f in @('configure-log.txt','build-log.txt','test-log.txt','smoke-log.txt')) {
            if (Test-Path $f) {
              $hits = Get-Content $f | Select-String -Pattern 'error|FEHLGESCHLAGEN|FEHLER|beendet|nicht' | Select-Object -First 60
              $text = ($hits | ForEach-Object { $_.Line.Trim() }) -join '%0A'
              if (-not $text) { $text = ((Get-Content $f | Select-Object -Last 40) -join '%0A') }
              Write-Output "::error title=$f::$text"
            }
          }

      - name: Paket erstellen
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\Release\QFiles.exe dist\
          Copy-Item README.md dist\
          Compress-Archive -Path dist\* -DestinationPath QFiles-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: QFiles-x64
          path: |
            build/Release/QFiles.exe
            QFiles-x64.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: |
            screenshot*.png
            QFiles-Absturz.*
          if-no-files-found: ignore

      - name: Bildschirmfoto in Zweig ci-screenshot
        if: always() && github.event_name == 'workflow_dispatch' && inputs.screenshot_branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          New-Item -ItemType Directory -Force -Path $env:RUNNER_TEMP\shots | Out-Null
          Copy-Item screenshot*.png, QFiles-Absturz.*, *-log.txt $env:RUNNER_TEMP\shots\ -ErrorAction SilentlyContinue
          git checkout --orphan ci-screenshot
          git rm -rf --cached . | Out-Null
          Copy-Item $env:RUNNER_TEMP\shots\* .
          Get-ChildItem screenshot*.png, QFiles-Absturz.*, *-log.txt -ErrorAction SilentlyContinue | ForEach-Object { git add -f $_.Name }
          git commit -m "CI-Bildschirmfoto"
          git push -f origin ci-screenshot

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            QFiles-x64.zip
            build/Release/QFiles.exe

  mingw:
    name: Windows x64 (MinGW-w64, Cross-Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MinGW installieren
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 cmake
      - name: Bauen
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
