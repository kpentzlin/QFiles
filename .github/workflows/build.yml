name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      screenshot_branch:
        description: 'Bildschirmfoto zusätzlich in den Zweig ci-screenshot schreiben'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  msvc:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurieren
        run: |
          cmake -S . -B build -A x64 2>&1 | Tee-Object -FilePath configure-log.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Bauen
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build-log.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Tests ausführen
        run: |
          & build\Release\QFilesTests.exe 2>&1 | Tee-Object -FilePath test-log.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Starttest mit Bildschirmfoto
        run: |
          New-Item -ItemType Directory -Force -Path "C:\QFilesDemo\Ünïcödé 日本語 ✓" | Out-Null
          Set-Content -Path "C:\QFilesDemo\Ünïcödé 日本語 ✓\Grüße €.txt" -Value "Hallo Welt – äöü 日本語" -Encoding UTF8
          Set-Content -Path "C:\QFilesDemo\liesmich.txt" -Value "QFiles Starttest" -Encoding UTF8
          $p = Start-Process -FilePath "build\Release\QFiles.exe" -ArgumentList '"C:\QFilesDemo"','"C:\Windows"' -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { "QFiles hat sich unerwartet beendet (Exitcode $($p.ExitCode))" | Tee-Object -FilePath smoke-log.txt; exit 1 }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\screenshot.png")
          # Zweites Bild: rechte Liste teilen (Strg+T), links Datei wählen, Dateianzeige im anderen Fenster (Strg+Q)
          $ws = New-Object -ComObject WScript.Shell
          $null = $ws.AppActivate($p.Id)
          Start-Sleep -Milliseconds 800
          [System.Windows.Forms.SendKeys]::SendWait("^2")
          Start-Sleep -Milliseconds 500
          [System.Windows.Forms.SendKeys]::SendWait("^t")
          Start-Sleep -Milliseconds 800
          [System.Windows.Forms.SendKeys]::SendWait("^1")
          Start-Sleep -Milliseconds 300
          [System.Windows.Forms.SendKeys]::SendWait("{HOME}{DOWN}{DOWN}")
          Start-Sleep -Milliseconds 300
          [System.Windows.Forms.SendKeys]::SendWait("^q")
          Start-Sleep -Seconds 2
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\screenshot2.png")
          if ($p.HasExited) { "QFiles hat sich nach Tastatureingaben beendet (Exitcode $($p.ExitCode))" | Tee-Object -FilePath smoke-log.txt; exit 1 }
          $p.CloseMainWindow() | Out-Null
          Start-Sleep -Seconds 3
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not (Test-Path "C:\ProgramData\QFiles\QFiles.ini")) {
            "Einstellungsdatei wurde nicht in C:\ProgramData\QFiles angelegt" | Tee-Object -FilePath smoke-log.txt; exit 1
          }
          Write-Output "Einstellungsdatei angelegt: C:\ProgramData\QFiles\QFiles.ini"

      - name: Fehlerdiagnose
        if: failure()
        run: |
          foreach ($f in @('configure-log.txt','build-log.txt','test-log.txt','smoke-log.txt')) {
            if (Test-Path $f) {
              $hits = Get-Content $f | Select-String -Pattern 'error|FEHLGESCHLAGEN|FEHLER|beendet|nicht' | Select-Object -First 60
              $text = ($hits | ForEach-Object { $_.Line.Trim() }) -join '%0A'
              if (-not $text) { $text = ((Get-Content $f | Select-Object -Last 40) -join '%0A') }
              Write-Output "::error title=$f::$text"
            }
          }

      - name: Paket erstellen
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\Release\QFiles.exe dist\
          Copy-Item README.md dist\
          Compress-Archive -Path dist\* -DestinationPath QFiles-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: QFiles-x64
          path: |
            build/Release/QFiles.exe
            QFiles-x64.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: screenshot*.png
          if-no-files-found: ignore

      - name: Bildschirmfoto in Zweig ci-screenshot
        if: github.event_name == 'workflow_dispatch' && inputs.screenshot_branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          Copy-Item screenshot*.png $env:RUNNER_TEMP\
          git checkout --orphan ci-screenshot
          git rm -rf --cached . | Out-Null
          Copy-Item $env:RUNNER_TEMP\screenshot*.png .
          git add screenshot*.png
          git commit -m "CI-Bildschirmfoto"
          git push -f origin ci-screenshot

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            QFiles-x64.zip
            build/Release/QFiles.exe

  mingw:
    name: Windows x64 (MinGW-w64, Cross-Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MinGW installieren
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 cmake
      - name: Bauen
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
